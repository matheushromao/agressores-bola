# Configuração comum a todos os perfis. Este arquivo é versionado e por isso
# NUNCA contém credenciais: elas vêm de variáveis de ambiente ou de um .env
# na raiz do projeto (ignorado pelo Git).
spring:
  application:
    name: agressores-da-bola
  config:
    import: optional:file:.env[.properties]
  profiles:
    # Vale quando nenhum perfil é informado; SPRING_PROFILES_ACTIVE sobrescreve
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # O schema pertence ao Flyway (db/migration). O Hibernate só confere se
      # as entidades batem com o banco e recusa subir se houver divergência.
      ddl-auto: validate
  data:
    web:
      pageable:
        # Tamanho usado quando o cliente não informa "size"
        default-page-size: 10
        # Teto de segurança: impede ?size=100000 derrubar a aplicação
        max-page-size: 50
        # A primeira página é a 0 (padrão do Spring Data)
        one-indexed-parameters: false

app:
  jwt:
    # Segredo HMAC do token (HS256): pelo menos 32 bytes, sem valor padrão.
    # Gere com: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiracao: PT2H
  cors:
    # Origens do frontend autorizadas, separadas por vírgula
    origens: ${CORS_ORIGENS:http://localhost:5173}

springdoc:
  api-docs:
    # Contrato OpenAPI em JSON, consumido pelo gerador de cliente do frontend
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Agrupa por método HTTP e ordena as tags, para a página não mudar de
    # ordem a cada start
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
