<div class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <header class="border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-4 px-4 py-3">
      <a routerLink="/peladas" class="flex items-center gap-2 text-lg font-bold tracking-tight">
        <span aria-hidden="true">⚽</span>
        <span>Agressores da Bola</span>
      </a>

      <nav class="flex items-center gap-1 text-sm">
        <a
          routerLink="/peladas"
          routerLinkActive="bg-emerald-100 text-emerald-900 dark:bg-emerald-900/40 dark:text-emerald-100"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-md px-3 py-1.5 font-medium hover:bg-slate-100 dark:hover:bg-slate-800"
          >Peladas</a
        >
        @if (auth.autenticado()) {
          <a
            routerLink="/minhas-peladas"
            routerLinkActive="bg-emerald-100 text-emerald-900 dark:bg-emerald-900/40 dark:text-emerald-100"
            class="rounded-md px-3 py-1.5 font-medium hover:bg-slate-100 dark:hover:bg-slate-800"
            >Minhas peladas</a
          >
        }
      </nav>

      <div class="ms-auto flex items-center gap-2 text-sm">
        @if (auth.autenticado()) {
          <span class="hidden text-slate-600 sm:inline dark:text-slate-400">
            Olá, <strong class="font-semibold text-slate-900 dark:text-slate-100">{{ auth.nickname() }}</strong>
          </span>
          <button
            type="button"
            (click)="sair()"
            class="rounded-md border border-slate-300 px-3 py-1.5 font-medium hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800"
          >
            Sair
          </button>
        } @else {
          <a
            routerLink="/login"
            class="rounded-md px-3 py-1.5 font-medium hover:bg-slate-100 dark:hover:bg-slate-800"
            >Entrar</a
          >
          <a
            routerLink="/cadastro"
            class="rounded-md bg-emerald-600 px-3 py-1.5 font-medium text-white hover:bg-emerald-700"
            >Criar conta</a
          >
        }
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <router-outlet />
  </main>
</div>
