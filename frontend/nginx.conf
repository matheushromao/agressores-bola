# Serve a SPA e encaminha a API, de modo que browser e back conversem pela
# mesma origem: sem CORS e sem o front precisar saber o endereço da API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API e contrato OpenAPI vão para o serviço da aplicação na rede do Compose
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI pela mesma porta, para não precisar lembrar de duas
    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Os nomes dos arquivos do Angular já carregam hash do conteúdo, então
    # podem ser cacheados para sempre: uma versão nova gera outro nome
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index, ao contrário, nunca é cacheado: é ele que aponta para os
    # arquivos novos depois de um deploy
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Rota de SPA: /peladas/7/sumula não existe em disco e precisa cair no
    # index para o roteador do Angular resolver
    location / {
        try_files $uri $uri/ /index.html;
    }
}
